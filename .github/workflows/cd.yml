name: TripSphere-cd
on:
  workflow_call:
  
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:

      - name: Connect to EC2
        uses: appleboy/ssh-action@v1 
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{github.sha}}
        with:
          envs: GHCR_PAT, IMAGE_TAG
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            : "${IMAGE_TAG:?IMAGE_TAG was not provided}"
            cd /home/ubuntu/TripSphere
            git pull origin main
            echo "$GHCR_PAT" | docker login ghcr.io -u Ayush2112004 --password-stdin
            docker compose pull
            docker compose up -d
              echo "Checking backend health..."

            for i in {1..15}; do
              if docker compose exec -T backend curl -fsS http://localhost:5000/api/health; then
                echo "Backend is healthy!"
                break
              fi

              if [ "$i" -eq 15 ]; then
                echo "Backend health check failed!"
                docker compose logs --tail=50 backend
                exit 1
              fi

              echo "Waiting for backend..."
              sleep 2
            done
            docker compose ps



    