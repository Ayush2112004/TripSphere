name: TripSphere-CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name:  Build App
        run: npm run build
        working-directory: ./client

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./server
      - name: Run ESLint
        run: npm run lint
        working-directory: ./server

      - name: Run backend tests
        run: npm test
        working-directory: ./server
      - name : start backend
        run: npm start > backend.log 2>&1 &
        working-directory: ./server
      - name: Check backend health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          cat server/backend.log
          exit 1

  build-image:
    needs: [frontend,backend]
    name: build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: tripsphere-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: tripsphere-frontend:latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

