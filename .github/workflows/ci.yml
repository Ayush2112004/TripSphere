name: TripSphere-CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name:  Build App
        run: npm run build
        working-directory: ./client

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name : start backend
        run: npm start > backend.log 2>&1 &
        working-directory: ./server
            - name: Check backend health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          cat server/backend.log
          exit 1

