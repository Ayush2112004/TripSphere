name: TripSphere-Rollback

on:
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Enter the commit SHA to rollback to:'
                required: true
                type: string

jobs:
    rollback:
        runs-on: ubuntu-latest
        steps:
            - name: Connect to EC2
              uses : appleboy/ssh-action@v1
              env:
                IMAGE_TAG: ${{inputs.image_tag}}
                GHCR_PAT: ${{secrets.GHCR_PAT}}
              with:
                envs: IMAGE_TAG, GHCR_PAT
                host: ${{secrets.EC2_HOST}}
                username: ${{secrets.EC2_USERNAME}}
                key: ${{secrets.EC2_SSH_KEY}}
                script: |
                    set -e
                    : "${IMAGE_TAG:?IMAGE_TAG was not provided}"                    
                    if [[ ! "$IMAGE_TAG" =~ ^[a-fA-F0-9]{40}$ ]]; then
                        echo "Invalid image tag. Expected a 40-character commit SHA."
                        exit 1
                    fi
                    cd /home/ubuntu/TripSphere

                    echo "$GHCR_PAT" | docker login ghcr.io -u Ayush2112004 --password-stdin
                    docker compose pull
                    docker compose up -d
                    docker compose ps
