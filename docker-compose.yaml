services:
  backend:
    image: ghcr.io/ayush2112004/tripsphere-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: backend-container
    env_file:
      - ./server/.env
    expose:
      - "5000"
  frontend:
    image: ghcr.io/ayush2112004/tripsphere-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: frontend-container
    ports:
      - "80:80"
    depends_on:
      - backend
